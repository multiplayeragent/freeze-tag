 *                   Only the host writes these.

 *   INPUT & SOUND . keyboard, mouse, touch stick and dash button, WebAudio effects

/** A runner bot flees a tagger that's close, otherwise goes to thaw a frozen friend, otherwise wanders. */
function thinkRunner(b, G, all, now) {
  const taggers = all.filter((c) => G.tag.includes(c.id)), near = taggers.sort((p, q) => dist(p, b) - dist(q, b))[0], dn = near ? dist(near, b) : 99;
  b.wantDash = false; b.chase = "";
  if (dn < CONFIG.botFear) { // flee: the reachable spot ahead that keeps the most room from every tagger
    let best = null, bestScore = -1e9;
    for (let k = 0; k < 32; k++) {
      const a = (k / 16) * Math.PI * 2, r = k < 16 ? 7 : 4, p = { x: b.x + Math.sin(a) * r, z: b.z + Math.cos(a) * r };
      if (!walkable(p.x, p.z)) continue;
      const room = Math.min(...taggers.map((T) => dist(T, p))), edge = Math.min(HALF - Math.abs(p.x), HALF - Math.abs(p.z));
      const s = room - (edge < 5 ? (5 - edge) * 1.5 : 0) - (clearLine(b, p) ? 0 : 6) + Math.random() * 0.6;
      if (s > bestScore) { bestScore = s; best = p; }
    }
    b.mode = "flee"; setGoal(b, best);
    b.wantDash = dn < 3.4 && Math.random() < 0.65;
    return;
  }
  const stuck = all.filter((c) => !G.tag.includes(c.id) && G.frz[c.id] && c.id !== b.id && Math.min(99, ...taggers.map((T) => dist(T, c))) > 4.5).sort((p, q) => dist(p, b) - dist(q, b))[0];
  if (stuck && dist(stuck, b) < 22) { b.mode = "thaw"; setGoal(b, { x: stuck.x, z: stuck.z }); return; }
  if (b.mode !== "wander" || !b.goal || dist(b, b.goal) < 1 || now > b.wander) { b.mode = "wander"; b.wander = now + 3000; setGoal(b, randomSpot()); }
}
function randomSpot() { for (;;) { const p = { x: (Math.random() - 0.5) * (CONFIG.arena - 6), z: (Math.random() - 0.5) * (CONFIG.arena - 6) }; if (walkable(p.x, p.z)) return p; } }
/** One movement step (yours or a bot's): input mx/mz in -1..1, dash true/false. */
function stepBody(b, inp, dt, speed, now, frozen) {
  if (frozen) { b.vx = b.vz = 0; b.a = 0; return; }
  let { mx, mz } = inp; const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  if (inp.dash && len > 0.1 && now >= b.dashReady) { b.dashUntil = now + CONFIG.dashMs; b.dashReady = now + CONFIG.dashCooldown; b.dx = mx / Math.max(len, 1e-3); b.dz = mz / Math.max(len, 1e-3); if (b === me) sound("dash"); }
  const dashing = now < b.dashUntil, want = speed * (dashing ? CONFIG.dashSpeed : 1);
  const tx = dashing ? b.dx * want : mx * want, tz = dashing ? b.dz * want : mz * want, k = Math.min(1, CONFIG.accel * dt * (dashing ? 2 : 1));
  b.vx += (tx - b.vx) * k; b.vz += (tz - b.vz) * k;
  moveBody(b, b.vx * dt, b.vz * dt);
  const sp = Math.hypot(b.vx, b.vz);
  if (sp > 0.5) b.h += angDiff(Math.atan2(b.vx, b.vz), b.h) * Math.min(1, dt * 14);
  b.a = dashing ? 2 : sp > 1 ? 1 : 0;
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
const FRIENDLY = ["Zippy", "Sunny", "Bouncy", "Lucky", "Speedy", "Sneaky"], CRITTERS = ["Otter", "Fox", "Bunny", "Panda", "Gecko", "Koala"];
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() || FRIENDLY[Math.floor(Math.random() * 6)] + " " + CRITTERS[Math.floor(Math.random() * 6)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { ...newBody(), id: "", gameId: -1, lastSend: 0, view: null, playAt: 0 };
const nameOf = (id) => (id === net.sessionId ? myName : isBot(id) ? host.bots.get(id)?.name || botList().find((b) => b.i === id)?.n || "Bot" : S.entities.players[id]?.n || "Player");
const colorOf = (id) => (id === net.sessionId ? myColor : isBot(id) ? host.bots.get(id)?.color || "#ccc" : S.entities.players[id]?.c || "#ccc");

function myTick(dt, g, now) {
  if (me.gameId !== g.id) { me.gameId = g.id; Object.assign(me, newBody(), spawnFor(net.sessionId, g)); $("over").hidden = true; }
  const tagger = g.tag.includes(net.sessionId);
  const inp = !canMove(net.sessionId, g) ? STILL : ATTRACT ? botInput(me, g, people(g), now) : readInput();
  stepBody(me, inp, dt, tagger ? CONFIG.taggerSpeed : CONFIG.speed, now, !!g.frz[net.sessionId]);
  if (now - me.lastSend > 80) { // ~12/s
    me.lastSend = now;
    net.me.set("p", JSON.stringify({ g: g.id, x: +me.x.toFixed(2), z: +me.z.toFixed(2), h: +me.h.toFixed(2), a: me.a }));
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}`;
const local = { big: "", bigUntil: 0 };
const bigText = (html, ms) => { local.big = html; local.bigUntil = performance.now() + ms; };
let board = null, boardFor = -1, reconnecting = false;
function hud(g) {
  const t = Date.now(), tagger = g.tag.includes(net.sessionId), frozen = !!g.frz[net.sessionId];
  $("frost").style.opacity = frozen && g.phase !== "over" && !ATTRACT ? 1 : 0;
  if (ATTRACT) { for (const id of ["round", "role", "big", "msg", "net"]) $(id).textContent = ""; return; }
  const runners = people(g).filter((c) => !g.tag.includes(c.id));
  const icons = runners.map((c) => (g.frz[c.id] ? "🧊" : "🏃")).join("");
  $("round").innerHTML = g.phase === "over" ? "" : `${g.phase === "brief" ? "Get ready" : fmt(Math.max(0, g.endsAt - t))}<small>${icons}</small>`;
  $("role").classList.toggle("tagger", tagger); $("role").classList.toggle("runner", !tagger);
  $("role").textContent = g.phase === "over" ? "" : tagger ? "❄ You're a TAGGER" : frozen ? "🧊 You're FROZEN" : "🏃 You're a RUNNER";
  let big = performance.now() < local.bigUntil ? local.big : "";
  if (g.phase === "brief") big = tagger ? `${Math.max(1, Math.ceil((g.startAt - t) / 1000))}<small>Count to three… then freeze them all!</small>` : `RUN!<small>The taggers start in ${Math.max(1, Math.ceil((g.startAt - t) / 1000))}…</small>`;
  $("big").innerHTML = big ? `<div>${big}</div>` : "";
  let msg = "";
  if (g.phase === "play" || g.phase === "brief") {
    if (!me.playAt) me.playAt = t;
    const thawing = runners.find((c) => g.frz[c.id] && g.th[c.id] && g.th[c.id][1] === net.sessionId);
    if (frozen) msg = g.th[net.sessionId] ? "A friend is thawing you… hold on!" : "Frozen! A free runner can thaw you by standing next to you.";
    else if (thawing) msg = `Thawing ${esc(thawing.name)}… stay close!`;
    else if (t - me.playAt < 9000) msg = touchUI ? "Left thumb runs · DASH for a burst of speed" : "WASD or hold the mouse to run · Space to dash";
    else if (!tagger && runners.some((c) => g.frz[c.id])) msg = "Stand next to a frozen friend to thaw them";
  }
  $("msg").textContent = msg;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : reconnecting ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the round" : ""}`;
  $("dash").classList.toggle("wait", performance.now() < me.dashReady);
  const over = g.phase === "over" && t - g.endedAt > 1200;
  $("over").hidden = !over;
  if (over) results(g, t);
}
function results(g, t) {
  const mine = g.pts[net.sessionId] || 0, inRound = g.roster.some((r) => r[0] === net.sessionId), tagger = g.tag.includes(net.sessionId);
  const won = inRound && ((g.win === "runners" && !tagger) || (g.win === "taggers" && tagger));
  $("overTitle").textContent = g.win === "runners" ? (won ? "You held out! Runners win" : "Runners win!") : g.win === "taggers" ? (won ? "Everyone frozen! Taggers win" : "Frozen solid! Taggers win") : "Round over";
  $("overLine").textContent = inRound ? `You scored ${mine} point${mine === 1 ? "" : "s"}${won ? " and your team won" : ""}.` : "You'll join the next round.";
  const rows = g.roster.map(([id, name]) => ({ id, name: S.entities.players[id]?.n || name, pts: g.pts[id] || 0, tag: g.tag.includes(id) })).sort((a, b) => b.pts - a.pts).slice(0, 10);
  $("results").innerHTML = rows.map((r) => `<li class="${r.id === net.sessionId ? "me" : ""}">${r.tag ? "❄ " : ""}${esc(r.id === net.sessionId ? "You" : r.name)}<span>${r.pts}</span></li>`).join("");
  $("next").textContent = `Next round in ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(inRound && me.gameId === g.id ? mine : 0); }
}
function showBoard(score) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} pts</span></li>`).join("") : "<li>No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
/** Keep a color nobody else has: the later sessionId gives way, and the bots' colors count as taken. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList().map((b) => b.c);
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]);
  const free = COLORS.find((c) => !used.has(c));
  if (!free || free === myColor) return;
  myColor = free; net.me.set("c", myColor);
  if (me.view) { scene.remove(me.view.g); me.view = null; }
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "over") return; if (isHost()) host.again = true; else net.send("again", {}); $("over").hidden = true; };

/** One-off effects worked out from what changed in state (so nobody misses one). */
let prevG = null;
function effects(g, all) {
  if (prevG && prevG.id === g.id) {
    const at = (id) => all.find((c) => c.id === id);
    for (const id of Object.keys(g.frz)) if (!prevG.frz[id]) {
      const c = at(id); if (c) burst(c.x, 1.2, c.z, ["#ffffff", "#a8ecff", "#5fd0ff"], 26, 9);
      sound("freeze"); if (id === net.sessionId) { shake = 0.5; bigText("FROZEN!", 1300); }
    }
    for (const id of Object.keys(prevG.frz)) if (!g.frz[id] && g.phase === "play") {
      const c = at(id); if (c) burst(c.x, 1.2, c.z, ["#ffb347", "#ffe066", "#ff7a3d"], 22, 8);
      sound("thaw"); if (id === net.sessionId) bigText("THAWED!", 1100);
    }
    if (g.phase === "play" && prevG.phase === "brief") { sound("go"); bigText("GO!", 800); }
    if (g.phase === "over" && prevG.phase !== "over") sound(g.win === "taggers" ? "sweep" : "bell");
  }
  prevG = g;
}

// ── INPUT & SOUND ───────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("dash").hidden = !touchUI;
if (touchUI) $("msg").style.bottom = "calc(max(18px, env(safe-area-inset-bottom)) + 120px)";
const keys = new Set(), stick = { id: -1, ox: 0, oy: 0, mx: 0, mz: 0 }, mouse = { down: false, nx: 0, ny: 0 };
let dashAt = 0;
addEventListener("keydown", (e) => { keys.add(e.key.toLowerCase()); if (e.key === " " || e.key === "Shift") { e.preventDefault(); dashAt = performance.now(); } unlockAudio(); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
const ray = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  let mx = k("d", "arrowright") - k("a", "arrowleft") + stick.mx, mz = k("s", "arrowdown") - k("w", "arrowup") + stick.mz;
  if (!mx && !mz && mouse.down) { // run toward the ground point under the pointer, through the camera that drew this frame
    ray.setFromCamera({ x: mouse.nx, y: mouse.ny }, camera);
    if (ray.ray.intersectPlane(groundPlane, hit)) { const dx = hit.x - me.x, dz = hit.z - me.z, d = Math.hypot(dx, dz); if (d > 0.4) { mx = dx / d; mz = dz / d; } }
  }
  return { mx, mz, dash: performance.now() - dashAt < 150 };
}
const cv = renderer.domElement;
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { if (e.button === 2) dashAt = performance.now(); else mouse.down = true; mouse.nx = (e.clientX / innerWidth) * 2 - 1; mouse.ny = -(e.clientY / innerHeight) * 2 + 1; return; }
  if (stick.id >= 0) return;
  cv.setPointerCapture(e.pointerId);
  Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, mx: 0, mz: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.nx = (e.clientX / innerWidth) * 2 - 1; mouse.ny = -(e.clientY / innerHeight) * 2 + 1; }
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1);
  stick.mx = dx * k; stick.mz = dy * k;
  $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.mz * 35}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => {
  if (e.pointerType === "mouse" && e.button !== 2) mouse.down = false;
  if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, mz: 0 }); $("stick").hidden = true; }
});
$("dash").addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); dashAt = performance.now(); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function sound(kind) {
  if (!AC) return;
  const t0 = AC.currentTime, tone = (f, d, type, v, f2, delay = 0) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + delay); o.frequency.exponentialRampToValueAtTime(f2, t0 + delay + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.setValueAtTime(v, t0 + delay); g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + delay + d);
  };
  if (kind === "freeze") { tone(1900, 0.35, "sine", 0.12, 600); tone(2600, 0.25, "triangle", 0.06, 1200, 0.05); }
  if (kind === "thaw") { tone(330, 0.25, "triangle", 0.14, 880); tone(660, 0.2, "sine", 0.08, 1320, 0.08); }
  if (kind === "dash") tone(240, 0.16, "sawtooth", 0.05, 90);
  if (kind === "go") tone(660, 0.3, "square", 0.08, 990);
  if (kind === "bell") { tone(523, 0.5, "triangle", 0.14, 523); tone(659, 0.5, "triangle", 0.12, 659, 0.12); tone(784, 0.7, "triangle", 0.12, 784, 0.24); }
  if (kind === "sweep") { tone(1200, 0.6, "sine", 0.12, 300); tone(1600, 0.8, "triangle", 0.06, 400, 0.1); }
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, shake = 0;
const camLook = new THREE.Vector3(), camGoal = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { renderer.render(scene, camera); return; }
  myTick(dt, g, now);
  const all = people(g);
  effects(g, all);
  drawKids(g, all, now, t, dt);
  drawParts(dt);
  moveCamera(g, all, dt);
  renderer.render(scene, camera);
  if (now - lastHud > 100) { lastHud = now; hud(g); }
}
function drawKids(g, all, now, t, dt) {
  const seen = new Set(), live = new Set(livePlayers()), td = Date.now();
  const thaw = (id) => (g.th[id] ? (td - g.th[id][0]) / CONFIG.thawMs : 0);
  const draw = (v, id, s) => {
    v.x = s.x; v.z = s.z; v.h = s.h; v.g.position.set(s.x, 0, s.z); v.g.rotation.y = s.h;
    poseKid(v, s.a, g.tag.includes(id), !!g.frz[id], thaw(id), !!g.safe[id], t, dt);
    if (s.a === 2 && Math.random() < 0.5) burst(s.x, 0.15, s.z, ["#ffffff", "#e6f5d0"], 1, 2);
  };
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const q = posOf(id, p);
    if (!q || q.g !== g.id) continue;
    const s = sample(feed(id, p.p, q, now), now);
    seen.add(id); draw(viewOf(id, p.c || "#ccc", p.n || "Player"), id, s);
  }
  const host_ = isHost(), bots = host_ ? [...host.bots.values()] : botList(), raw = S.shared.bots;
  for (const b of bots) {
    const id = host_ ? b.id : b.i, s = host_ ? b : sample(feed(id, raw, b, now), now);
    seen.add(id); draw(viewOf(id, host_ ? b.color : b.c, host_ ? b.name : b.n), id, s);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); tracks.delete(id); }
  if (!me.view) me.view = makeKid(myColor, "");
  draw(me.view, net.sessionId, me);
  // a pulsing ring under you so you can always find yourself
  if (!youRing.parent) scene.add(youRing);
  youRing.visible = !ATTRACT; youRing.position.set(me.x, 0.03, me.z); youRing.scale.setScalar(1.3 + Math.sin(t * 4) * 0.08);
}
const youRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 36).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7, depthWrite: false }));
/** High and behind you (higher on a tall phone). ?attract follows the first tagger and whoever it is after. */
function moveCamera(g, all, dt) {
  let fx = me.x, fz = me.z;
  if (ATTRACT) {
    const T = all.find((c) => c.id === g.tag[0]);
    if (T) {
      const prey = all.filter((c) => !g.tag.includes(c.id) && !g.frz[c.id] && dist(c, T) < 7).sort((p, q) => dist(p, T) - dist(q, T))[0];
      fx = prey ? T.x + (prey.x - T.x) * 0.4 : T.x; fz = prey ? T.z + (prey.z - T.z) * 0.4 : T.z;
    }
  }
  const tall = camera.aspect < 1, hgt = ATTRACT ? 12 : tall ? 25 : 17, back = ATTRACT ? 4.5 : 12;
  camGoal.set(fx, 0, fz);
  camLook.lerp(camGoal, 1 - Math.pow(ATTRACT ? 0.08 : 0.002, dt));
  shake = Math.max(0, shake - dt);
  camera.position.set(camLook.x + (Math.random() - 0.5) * shake, hgt, camLook.z + back + (Math.random() - 0.5) * shake);
  camera.lookAt(camLook.x, 0, camLook.z - 0.5);
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  camLook.set(0, 0, 10);
  requestAnimationFrame(frame);
})();
</script>
